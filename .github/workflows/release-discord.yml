name: Notify Discord on Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  discord_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Send Discord Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          DOWNLOAD_URL: https://smnsportslive.org/download
          ROLE: "<@&1504903044771479693>"

        run: |
          set -e

          TAG="${TAG:-v-test-1.0.0}"
          BODY="${BODY:-Test release body for Discord webhook (workflow_dispatch test mode)}"

          BODY=$(echo "$BODY" | head -c 1500)

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg body "$BODY" \
            --arg url "$DOWNLOAD_URL" \
            --arg role "$ROLE" \
            '{
              content: ($role + " **New Release: " + $tag + "**"),

              embeds: [
                {
                  title: ("🆕 Update Released — Version " + $tag),
                  color: 5814783,

                  fields: [
                    {
                      name: "📦 Repository",
                      value: $repo,
                      inline: false
                    },
                    {
                      name: "🧾 Patch Notes",
                      value: (if $body == "" then "No description provided." else $body end),
                      inline: false
                    },
                    {
                      name: "⬇️ Download",
                      value: ("[Click here to download](" + $url + ")"),
                      inline: false
                    }
                  ],

                  footer: {
                    text: "SMN Sports Live • Automated Release System"
                  }
                }
              ],

              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 5,
                      label: "Download Latest Build",
                      url: $url
                    }
                  ]
                }
              ]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$WEBHOOK_URL"
