name: Notify Discord on Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  discord_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          DOWNLOAD_URL: https://smnsportslive.org/download
          ROLE: "<@&1504903044771479693>"

        run: |
          set -e

          # -----------------------------
          # Get TAG + BODY safely
          # -----------------------------
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
            BODY=$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH")
          else
            TAG="v-test-1.0.0"
            BODY="Test release body for Discord webhook (workflow_dispatch test mode)"
          fi

          TAG="${TAG:-v-test-1.0.0}"
          BODY="${BODY:-No description provided}"

          # Hard trim only (NO sed hacks)
          BODY=$(printf "%.1500s" "$BODY")

          # -----------------------------
          # Build payload (SAFE jq only)
          # -----------------------------
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg body "$BODY" \
            --arg url "$DOWNLOAD_URL" \
            --arg role "$ROLE" \
            '{
              content: ($role + " **New Release: " + $tag + "**"),

              embeds: [
                {
                  title: ("🆕 Update Released — Version " + $tag),
                  color: 5814783,

                  fields: [
                    {
                      name: "📦 Repository",
                      value: $repo,
                      inline: false
                    },
                    {
                      name: "🧾 Patch Notes",
                      value: (if ($body | length) == 0 then "No description provided." else $body end),
                      inline: false
                    },
                    {
                      name: "⬇️ Download",
                      value: "https://smnsportslive.org/download",
                      inline: false
                    }
                  ],

                  footer: {
                    text: "SMN Sports • Automated Release System"
                  }
                }
              ],

              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 5,
                      label: "Download Latest Build",
                      url: "https://smnsportslive.org/download"
                    }
                  ]
                }
              ]
            }')

          # -----------------------------
          # Send to Discord
          # -----------------------------
          curl -sS -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$WEBHOOK_URL"
