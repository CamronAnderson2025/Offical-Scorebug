name: Notify Discord on Release

on:
  release:
    types: [published, released]
  workflow_dispatch:

jobs:
  discord_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          DOWNLOAD_URL: https://smnsportslive.org/download
          ROLE: "<@&1504903044771479693>"

        run: |
          set -e

          # -----------------------------
          # Extract release data safely
          # -----------------------------
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            BODY='${{ github.event.release.body }}'
            URL="${{ github.event.release.html_url }}"
          else
            TAG="v-test-1.0.0"
            BODY="Test release body for Discord webhook (workflow_dispatch test mode)"
            URL="https://github.com/${REPO}"
          fi

          TAG="${TAG:-v-test}"
          BODY="${BODY:-No description provided}"
          URL="${URL:-https://github.com/${REPO}}"

          # -----------------------------
          # Trim safely (Discord limit protection)
          # -----------------------------
          BODY=$(printf "%.1800s" "$BODY")

          # Escape quotes for JSON safety
          BODY=$(echo "$BODY" | sed 's/"/\\"/g')

          # -----------------------------
          # Build JSON payload safely
          # -----------------------------
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg body "$BODY" \
            --arg url "$URL" \
            --arg download "$DOWNLOAD_URL" \
            --arg role "$ROLE" \
            '{
              content: ($role + " 🚀 **New Release: " + $tag + "**"),

              embeds: [
                {
                  title: ("🆕 New Release — " + $tag),
                  url: $url,
                  color: 5814783,

                  fields: [
                    {
                      name: "📦 Repository",
                      value: $repo,
                      inline: false
                    },
                    {
                      name: "🧾 Release Notes",
                      value: (if ($body | length) == 0 then "No description provided." else $body end),
                      inline: false
                    },
                    {
                      name: "⬇️ Download",
                      value: $download,
                      inline: false
                    }
                  ],

                  footer: {
                    text: "SMN Sports • Automated Release System"
                  }
                }
              ]
            }')

          # -----------------------------
          # Send to Discord
          # -----------------------------
          curl -sS -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$WEBHOOK_URL"
