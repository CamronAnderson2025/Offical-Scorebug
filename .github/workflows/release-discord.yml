name: Notify Discord on Release

on:
  release:
    types: [published]

jobs:
  discord_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          DOWNLOAD_URL: https://smnsportslive.org/download
          ROLE: "<@&1504903044771479693>"
        run: |
          BODY=$(echo "$BODY" | head -c 1000)

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg body "$BODY" \
            --arg url "$DOWNLOAD_URL" \
            --arg role "$ROLE" \
            '{
              content: $role,
              embeds: [
                {
                  title: "New Release Published!",
                  color: 5814783,
                  fields: [
                    {name: "Repository", value: $repo, inline: false},
                    {name: "Release", value: $tag, inline: true},
                    {name: "Description", value: $body, inline: false}
                  ],
                  footer: {
                    text: "SMN Sports Live"
                  }
                }
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 5,
                      label: "Download",
                      url: $url
                    }
                  ]
                }
              ]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$WEBHOOK_URL"
