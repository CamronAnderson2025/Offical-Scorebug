name: Notify Discord on Release

on:
  release:
    types: [published]

jobs:
  discord_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        uses: actions/http-client@v1
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          method: POST
          headers: |
            Content-Type: application/json
          body: |
            {
              "content": "**New Release Published!**\nRepository: ${{ github.repository }}\nRelease: ${{ github.event.release.tag_name }}\nDescription: ${{ github.event.release.body }}\n[View Release](${{ github.event.release.html_url }})"
            }
